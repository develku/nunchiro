# cargo-nextest config for the pull-request gate (.github/workflows/ci.yml) and local runs: `--config-file scripts/nextest.toml`.
# No retries anywhere: a test that needs a retry is flaky and fails (fix it or mark it #[ignore] with the reason).
# No default-filter: every workspace test runs in CI; a default-filter would hide some from every run.
# fail-fast off in the default profile: one gate run lists every failing test.
[profile.default]
retries = 0
fail-fast = false

# target/nextest/default/junit.xml: the failing tests by name, for a reader that should not parse the log.
[profile.default.junit]
path = "junit.xml"

[profile.trial]
retries = 0
fail-fast = false

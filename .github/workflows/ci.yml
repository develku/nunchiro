# The merge gate (ticket 1134): pull requests run it, the merge queue runs it on the merged tree, and the one required
# check is the `gate` job. A push to main runs the whole gate again (ticket 1148): with no merge queue it is the run that
# tests every main tip after it lands, and scripts/measure/ci-log.py reads these runs for the scorecard. It is also the
# only run that saves build caches: caches written on main can be read by every pull request and merge-queue run, caches
# written there cannot (GitHub cache scoping; Orca warms main the same way, .github/workflows/ci-cache-warmup.yml:89 at
# stablyai/orca 2fbb071e).
# Rust runs on macOS only: nunchiro-core uses macOS APIs (libproc, LOCAL_PEERTOKEN, renameatx_np) and does not build for
# Linux, so the tests are split over macOS runners from one nextest archive instead of over Linux runners.
name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; merge-queue and main runs are never cancelled (T3 Code ci.yml:12-14).
# The group of a main run is its commit: in one group per branch GitHub keeps one waiting run and cancels the one that
# waited before it, so two landings during a run would leave a main tip untested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: 0.9.150

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # the message check below reads the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the ratchets read the base commit
      # A step, not a job: a job that runs on pull requests only would be skipped on main and fail `gate`. The text is
      # read live from the API, never from the event, so after fixing a title or body `gh run rerun --failed` is enough.
      - name: Pull request title, body and commit messages (scripts/check-messages.sh)
        if: github.event_name == 'pull_request'
        run: scripts/check-messages.sh --pr "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
      # The one scenario test that reads the docs scripts/docs-only.sh lets skip the web job (every exported *.md), so it
      # runs here on every run too.
      - run: python3 -B -m unittest tests/scenario/test_export_links.py
      # The ratchets of scripts/ (dead clicks, no-op clicks, overlaps, raw literals, file sizes): no baseline grows and no
      # count rises above its baseline or the base commit's own. HEAD^ is the base: a pull request's checkout is its merge
      # commit (first parent: the base branch), and a main tip is one squash merge on the tip before it.
      - name: Ratchets (.github/scripts/ratchets.py)
        run: python3 -B .github/scripts/ratchets.py HEAD^
      - run: rustup toolchain install # the version and components in rust-toolchain.toml
      - run: cargo fmt --all --check
      - name: sh -n scripts/scenario/*.sh
        run: for f in scripts/scenario/*.sh; do sh -n "$f"; done
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1, version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        working-directory: web

  # clippy, doctests and one build of every test binary; the partitions below run the archive.
  rust-build:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.web_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-dev
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Packages and web/dist (the core embeds it)
        run: scripts/setup-worktree.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest archive --workspace --config-file scripts/nextest.toml --archive-file nextest-archive.tar.zst
      - run: cargo test --workspace --doc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0 # already zstd

  rust-test:
    needs: rust-build
    runs-on: macos-latest
    timeout-minutes: 45
    # Two partitions at 4 test threads each, not three at the runner's 3: most tests wait on a spawned core or a timeout,
    # not on the CPU, and the free plan runs only 5 macOS jobs at once, so one fewer job per run shortens the queue.
    # At 6 threads a core's 2-5 s probe limits ran out under load (a Codex start probe on main), so 4.
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      # holder.rs core_swap_keeps_sessions_and_the_window builds a stamped core with `cargo build --offline --locked`;
      # the archive carries no crate sources, so the registry is filled here (ticket 1142).
      - run: cargo fetch --locked
      # Extracted over the checkout, so target/debug/nunchiro sits where the core tests look for it (tests/fixtures/cli.rs).
      - name: cargo nextest run (partition ${{ matrix.partition }}/${{ strategy.job-total }})
        run: >-
          cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --extract-to . --extract-overwrite
          --config-file scripts/nextest.toml --no-tests fail --test-threads 4 --partition count:${{ matrix.partition }}/${{ strategy.job-total }}

  # Pull requests skip the app check when no app input changed (scripts/check-app.sh APP_INPUTS), and the Rust and web
  # jobs when only safe docs changed (scripts/docs-only.sh); each saves macOS runners, of which the free plan has 5.
  # Main and merge-queue runs always run every job (main saves the caches, and scripts/measure/ci-log.py reads its runs).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.app.outputs.needed }}
      docs_only: ${{ steps.docs.outputs.only }}
      web_only: ${{ steps.web.outputs.only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: app
        run: |
          # Only exit 1 means "unchanged"; any other failure (a bad ref, a broken script) fails this job and so gate.
          needed=true
          if [ "$EVENT" = pull_request ]; then
            rc=0
            scripts/check-app.sh --needed "origin/$BASE" || rc=$?
            case $rc in 0) ;; 1) needed=false ;; *) echo "check-app.sh --needed exited $rc" >&2; exit 1 ;; esac
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
      - id: docs
        run: |
          # Fails open to running everything: only exit 0 skips; 1, a bad ref or a broken script all give false.
          only=false
          if [ "$EVENT" = pull_request ] && scripts/docs-only.sh "origin/$BASE"; then only=true; fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
      - id: web
        run: |
          # Window code and tests no Rust file reads (scripts/web-only.sh): the web job still compiles the core and runs
          # every window and scenario test, so only the Rust build and test jobs are skipped. Fails open like docs above.
          only=false
          if [ "$EVENT" = pull_request ] && scripts/web-only.sh "origin/$BASE"; then only=true; fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
          shared-key: macos-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: scripts/setup-worktree.sh
      # gen-notices reads `cargo metadata --offline`, which needs every locked crate, other platforms' included, on disk.
      - run: cargo fetch --locked && cargo fetch --locked --manifest-path app/src-tauri/Cargo.toml
      - run: scripts/check-app.sh

  # cli docs, the Python scenario suite and the Playwright core set: all three need the core binary.
  web:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-dev
          save-if: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: scripts/setup-worktree.sh
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      # Playwright first: its global setup compiles the core from this checkout (with the fixture web/dist it embeds), and
      # check-cli-docs reads --help from that binary instead of compiling the core a second time.
      - id: pw
        run: echo "version=$(cd web && pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install chromium
        working-directory: web
      - run: .github/scripts/web-core.sh
      - run: scripts/check-cli-docs.sh
        env:
          NUNCHIRO_BIN: target/debug/nunchiro
      - run: scripts/scenario-tests.sh
        env:
          SCENARIO_JOBS: 2

  # The one required check of the merge queue. `always()`: a skipped or cancelled job must still fail it (T3 Code
  # ci.yml:660-696; Orca pr.yml:1279). Add every new job to `needs`. The allowed skips: `app` when `changes` said no app
  # input changed, `rust-build`, `rust-test` and `web` when `changes` said only safe docs changed, and `rust-build` and
  # `rust-test` when it said only window code and tests no Rust file reads changed.
  gate:
    if: always()
    needs: [lint, changes, rust-build, rust-test, app, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.outputs.app as $app | .changes.outputs.docs_only as $docs
            | .changes.outputs.web_only as $webonly | all(to_entries[];
            .value.result == "success" or (.key == "app" and .value.result == "skipped" and $app == "false")
            or ((.key == "rust-build" or .key == "rust-test" or .key == "web") and .value.result == "skipped" and $docs == "true")
            or ((.key == "rust-build" or .key == "rust-test") and .value.result == "skipped" and $webonly == "true"))' > /dev/null

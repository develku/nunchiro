schema_version: "1.1"
name: trigger-orchestration-load-01
description: Should load the orchestration skill.
tags: [trigger, trigger-orchestration]
runs: 1
execution:
  prompt: "Split this feature into parallel lanes with Nunchiro workers, each in its own worktree, then merge the results."
  append_system_prompt: "You are running inside a Nunchiro session: NUNCHIRO_SESSION is set and the `nunchiro` CLI is on PATH. Reply to the request as you normally would."
  allowed_tools: [Skill, Read, Glob, Grep]
  max_turns: 4
  timeout_seconds: 120
graders:
  - name: skill-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestration"'

schema_version: "1.1"
name: trigger-orchestration-skip-03
description: Should not load the orchestration skill.
tags: [trigger, trigger-orchestration]
runs: 1
execution:
  prompt: "Make an SVG diagram of our three services."
  append_system_prompt: "You are running inside a Nunchiro session: NUNCHIRO_SESSION is set and the `nunchiro` CLI is on PATH. Reply to the request as you normally would."
  allowed_tools: [Skill, Read, Glob, Grep]
  max_turns: 4
  timeout_seconds: 120
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestration"'
    min: 0
    max: 0
    arm: both

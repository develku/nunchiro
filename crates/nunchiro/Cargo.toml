[package]
name = "nunchiro"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nunchiro-core = { path = "../nunchiro-core" }
serde_json.workspace = true
libc.workspace = true
sha2 = "0.11.1" # ticket 1082: the update stamp's hashes, as nunchiro-core

[features]
# Ticket 1130 A2: measurements that leave the default test run; scripts/extended-tests.sh runs them weekly.
measure = []

[[test]]
name = "idle_cpu"
path = "tests/idle_cpu.rs"
required-features = ["measure"]

[dev-dependencies]
tungstenite = "0.30" # S6: the window's WebSocket in the core-swap test

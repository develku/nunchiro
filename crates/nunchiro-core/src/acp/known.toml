# API key services run through OpenCode. A variable name is filled in only when the service names it in its own docs:
# openrouter.ai/docs/quickstart and platform.kimi.ai/docs/guide/start-using-kimi-api do; the Z.ai and BigModel pages name
# none (they use opencode auth login or a placeholder), so GLM stays blank.
[[known]]
name = "openrouter"
label = "OpenRouter"
command = "opencode"
args = ["acp"]
env = ["OPENROUTER_API_KEY"]
install_url = "https://opencode.ai"
docs_url = "https://openrouter.ai/docs/quickstart"
acp = true
service = true


# The agents Settings > Agents offers a row for (V2-4b). Bundled, never fetched online. No Claude entry: a Claude ACP
# agent is a custom entry and needs an API key (ADR 0001 Q3). `args` are each agent's documented ACP switch; a wrong
# one only makes the setup sheet's check fail visibly. `acp = false` is a terminal-only CLI. `docs_url` and `source_url`
# are each confirmed to answer and https only (the test in mod.rs); a tool with no confirmed page has none.
# The add steps: `install` (an argv) or `install_script` (the vendor's one line) is typed into a terminal tab and never
# run by Nunchiro; `sign_in` is the agent's own sign-in command; `cost`, `cost_line` and `pricing_url` were read on the
# vendor's page on `checked`. Prices change: the link is the reference.
# Gemini CLI's docs name `gemini --acp` (the older `--experimental-acp` is gone from them).
[[known]]
name = "gemini"
label = "Gemini CLI"
command = "gemini"
args = ["--acp"]
env = ["GEMINI_API_KEY"]
install_url = "https://github.com/google-gemini/gemini-cli"
docs_url = "https://geminicli.com/docs/"
source_url = "https://github.com/google-gemini/gemini-cli"
acp = true
install = ["npm", "install", "-g", "@google/gemini-cli"]
account = "Google"
cost = "paid_key"
cost_line = "Needs a paid API key. Free Google sign-in ended in June 2026."
pricing_url = "https://ai.google.dev/gemini-api/docs/pricing"
checked = "2026-11-27"

[[known]]
name = "opencode"
label = "OpenCode"
command = "opencode"
args = ["acp"]
env = []
install_url = "https://opencode.ai"
docs_url = "https://opencode.ai/docs"
source_url = "https://github.com/anomalyco/opencode"
acp = true
install_script = "curl -fsSL https://opencode.ai/install | bash"
sign_in = ["opencode", "auth", "login"]
account = "OpenCode"
cost = "free_models"
cost_line = "Free models are offered for a limited time. Other models are paid per use."
pricing_url = "https://opencode.ai/docs/zen/"
checked = "2026-11-27"


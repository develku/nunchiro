# The agents Settings > Agents offers a row for (V2-4b). Bundled, never fetched online. No Claude entry: a Claude ACP
# agent is a custom entry and needs an API key (ADR 0001 Q3). `args` are each agent's documented ACP switch; a wrong
# one only makes the setup sheet's check fail visibly. `acp = false` is a terminal-only CLI. `docs_url` and `source_url`
# (ticket 358) are each confirmed to answer and https only (the test in mod.rs); a tool with no confirmed page has none.
[[known]]
name = "gemini"
label = "Gemini CLI"
command = "gemini"
args = ["--experimental-acp"]
env = ["GEMINI_API_KEY"]
install_url = "https://github.com/google-gemini/gemini-cli"
docs_url = "https://geminicli.com/docs/"
source_url = "https://github.com/google-gemini/gemini-cli"
acp = true

[[known]]
name = "opencode"
label = "OpenCode"
command = "opencode"
args = ["acp"]
env = []
install_url = "https://opencode.ai"
docs_url = "https://opencode.ai/docs"
source_url = "https://github.com/anomalyco/opencode"
acp = true

[[known]]
name = "goose"
label = "goose"
command = "goose"
args = ["acp"]
env = []
install_url = "https://block.github.io/goose"
docs_url = "https://goose-docs.ai/docs/quickstart"
source_url = "https://github.com/aaif-goose/goose"
acp = true

[[known]]
name = "aider"
label = "Aider"
command = "aider"
args = []
env = []
install_url = "https://aider.chat"
docs_url = "https://aider.chat/docs/"
source_url = "https://github.com/Aider-AI/aider"
acp = false

